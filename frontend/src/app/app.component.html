<div class="vc-shell" [class.is-collapsed]="isCollapsed" [class.is-mobile-open]="mobileOpen">
  <!-- Sidebar Retrátil -->
  <app-sidebar [isCollapsed]="isCollapsed" (toggleCollapse)="toggleSidebar()"></app-sidebar>

  <!-- Backdrop Mobile -->
  @if (mobileOpen) {
    <button class="vc-backdrop" (click)="closeMobile()" aria-label="Fechar menu"></button>
  }

  <div class="vc-main">
    <!-- Topbar / Header -->
    <app-header
      [pageTitle]="pageTitle"
      [pageIcon]="pageIcon"
      (toggleMobile)="toggleMobile()">
    </app-header>

    <!-- Warning Global do Modo Automático (visível em todas as telas) -->
    <app-auto-mode-banner></app-auto-mode-banner>

    <!-- Conteúdo Principal da Feature Ativa -->
    <main class="vc-content">
      <router-outlet></router-outlet>
    </main>

    <!-- Footer -->
    <app-footer></app-footer>
  </div>

  <!-- Notificações globais (Toast) -->
  @if (toast.toasts().length > 0) {
    <div class="vc-toast-stack" role="status" aria-live="polite">
      @for (item of toast.toasts(); track item.id) {
        <div class="vc-toast-item" [class]="'vc-toast-item--' + item.kind">
          <span class="vc-toast-text">{{ item.text }}</span>
          <button type="button" class="vc-toast-close" (click)="toast.dismiss(item.id)" aria-label="Fechar aviso">
            <i class="bi bi-x-lg"></i>
          </button>
        </div>
      }
    </div>
  }
</div>
