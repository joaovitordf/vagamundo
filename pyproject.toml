[project]
name = "vagamundo"
version = "2.0.0"
description = "Assistente de candidaturas a vagas adaptado ao mercado brasileiro"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
tools = [
    "openpyxl>=3.1.0",
    "PyYAML>=6.0",
]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

